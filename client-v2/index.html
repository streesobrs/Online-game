<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联机大厅 v2</title>
  <!-- 基础样式（本地相对路径） -->
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/common.css">
  <!-- 响应式适配（放最后，覆盖各模块样式） -->
  <link rel="stylesheet" href="./src/styles/responsive.css">
  <!-- 游戏专属样式（随模块新增） -->
  <link rel="stylesheet" href="./src/games/gobang/styles.css">
  <link rel="stylesheet" href="./src/games/go/styles.css">
  <link rel="stylesheet" href="./src/games/chinese-chess/styles.css">
  <link rel="stylesheet" href="./src/games/snake/styles.css">

  <link rel="stylesheet" href="./src/features/chat/styles.css">
  <link rel="stylesheet" href="./src/features/achievements/styles.css">
  <link rel="stylesheet" href="./src/features/leaderboard/styles.css">
  <link rel="stylesheet" href="./src/features/ai-battle/styles.css">
  <link rel="stylesheet" href="./src/features/spectate/styles.css">
  <link rel="stylesheet" href="./src/features/shop/styles.css">
  <link rel="stylesheet" href="./src/features/profile/styles.css">
  <link rel="stylesheet" href="./src/features/themes/styles.css">
  <!-- 动态主题 CSS 由 src/features/themes/index.js 运行时注入（<style id="theme-dynamic-css">） -->
</head>

<body>
  <div id="app">
    <div id="nav-root"></div>
    <div id="view-root"></div>
  </div>
  <!-- 第三方库：用 v1 服务端自带的 socket.io（绝对路径，挂到 window.io） -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- 应用入口（原生 ES Modules，无构建） -->
  <script type="module" src="./src/main.js"></script>
</body>

</html>
