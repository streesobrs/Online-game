<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API文档 - 棋类大厅</title>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #141414;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #252525;
            --bg-hover: #2a2d2e;
            --bg-active: #374151;
            --border-color: #3c3c3c;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --success-bg: #064e3b;
            --success-text: #34d399;
            --error-bg: #450a0a;
            --error-text: #f87171;
            --warning-bg: #451a03;
            --warning-text: #fbbf24;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
        }

        .top-nav .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 32px;
        }

        .top-nav .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .top-nav .logo-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .top-nav .nav-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-nav .version-badge {
            padding: 3px 10px;
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--border-color);
        }

        .main-container {
            display: flex;
            height: calc(100vh - 48px);
            margin-top: 48px;
        }

        .sidebar-left {
            width: 260px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: var(--bg-secondary);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 12px;
        }

        .api-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .api-category {
            margin-bottom: 2px;
        }

        .category-header {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.15s;
            user-select: none;
        }

        .category-header:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .category-header i:first-child {
            width: 16px;
            color: var(--text-muted);
            transition: transform 0.2s;
            font-size: 10px;
            margin-right: 6px;
        }

        .category-header.collapsed i:first-child {
            transform: rotate(-90deg);
        }

        .category-header .category-icon {
            width: 18px;
            text-align: center;
            margin-right: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .category-name {
            flex: 1;
        }

        .category-count {
            color: var(--text-muted);
            font-size: 11px;
            background-color: var(--bg-tertiary);
            padding: 1px 6px;
            border-radius: 8px;
        }

        .api-items {
            padding-left: 0;
        }

        .api-item {
            display: flex;
            align-items: center;
            padding: 6px 16px 6px 40px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.15s;
            border-left: 2px solid transparent;
        }

        .api-item:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        .api-item.active {
            background-color: var(--bg-active);
            color: var(--text-primary);
            border-left-color: var(--accent-blue);
        }

        .method-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            margin-right: 8px;
            min-width: 48px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .method-get {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .method-post {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
        }

        .method-put {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
        }

        .method-delete {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .method-socket {
            background-color: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
        }

        .content-main {
            flex: 1;
            overflow-y: auto;
            background-color: var(--bg-primary);
            border-right: 1px solid var(--border-color);
        }

        .content-wrapper {
            padding: 24px 32px;
            max-width: 800px;
        }

        .doc-header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .doc-header .method-path {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .doc-header .method-badge {
            font-size: 11px;
            padding: 5px 10px;
            min-width: 60px;
        }

        .doc-header .path {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            flex: 1;
            background-color: var(--bg-tertiary);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .doc-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .doc-header .description {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .doc-section {
            margin-bottom: 32px;
        }

        .doc-section h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .doc-section h2 i {
            color: var(--text-muted);
            font-size: 12px;
        }

        .params-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .params-table th,
        .params-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .params-table th {
            background-color: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .params-table td {
            color: var(--text-secondary);
            vertical-align: top;
        }

        .params-table tbody tr:last-child td {
            border-bottom: none;
        }

        .params-table .param-required {
            color: var(--accent-red);
            font-weight: 600;
            font-size: 11px;
        }

        .params-table .param-optional {
            color: var(--text-muted);
            font-size: 11px;
        }

        .params-table .param-type {
            color: var(--accent-blue);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            background-color: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .code-wrapper {
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
        }

        .code-tabs {
            display: flex;
            gap: 4px;
        }

        .code-tab {
            padding: 4px 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .code-tab:hover {
            background-color: var(--bg-hover);
            color: var(--text-secondary);
        }

        .code-tab.active {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .code-actions {
            display: flex;
            gap: 8px;
        }

        .code-action-btn {
            padding: 4px 10px;
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .code-action-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .code-block pre {
            margin: 0;
            padding: 16px;
            overflow: auto;
            max-height: 400px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            background-color: #1e1e1e !important;
        }

        .code-block code {
            background-color: transparent !important;
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 13px;
            padding: 16px;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .sidebar-right {
            width: 460px;
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .test-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .test-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .test-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .test-header h3 i {
            color: var(--text-muted);
            font-size: 12px;
        }

        .test-url {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .url-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .method-select {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            background-color: var(--bg-tertiary);
            cursor: pointer;
            min-width: 70px;
        }

        .method-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .url-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            color: var(--text-primary);
            background-color: var(--bg-tertiary);
        }

        .url-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: var(--bg-secondary);
        }

        .send-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .test-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            background-color: var(--bg-tertiary);
        }

        .test-tab {
            padding: 10px 0;
            margin-right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            font-weight: 500;
        }

        .test-tab:hover {
            color: var(--text-secondary);
        }

        .test-tab.active {
            color: var(--text-primary);
        }

        .test-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--accent-blue);
        }

        .test-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .param-editor {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .param-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .param-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-primary);
            background-color: var(--bg-tertiary);
        }

        .param-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: var(--bg-secondary);
        }

        .param-input.key-input {
            flex: 0.4;
        }

        .param-input.value-input {
            flex: 0.6;
        }

        .param-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent-blue);
        }

        .delete-btn {
            padding: 6px 10px;
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: var(--error-bg);
            border-color: var(--accent-red);
            color: var(--error-text);
        }

        .add-btn {
            align-self: flex-start;
            padding: 8px 16px;
            background: none;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .add-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .body-editor {
            width: 100%;
            min-height: 200px;
            max-height: 400px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-primary);
            background-color: var(--bg-tertiary);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            resize: vertical;
            overflow: auto;
        }

        .body-editor:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: var(--bg-secondary);
        }

        .response-panel {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .response-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 12px;
            padding: 10px 12px;
            background-color: var(--bg-tertiary);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .status-success {
            color: var(--success-text);
            font-weight: 600;
        }

        .status-error {
            color: var(--error-text);
            font-weight: 600;
        }

        .status-warning {
            color: var(--warning-text, #d69e2e);
            font-weight: 600;
        }

        .time-info {
            color: var(--text-muted);
        }

        .response-actions {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }

        .response-action-btn {
            padding: 4px 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .response-action-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.2s ease;
        }

        .auth-section {
            margin-bottom: 16px;
        }

        .auth-section label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .auth-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .auth-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-primary);
            background-color: var(--bg-tertiary);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: var(--bg-secondary);
        }

        .auth-btn {
            padding: 8px 12px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-book"></i>
            </div>
            <span class="logo-title">API 文档</span>
        </div>
        <div class="nav-actions">
            <span class="version-badge" id="version-badge">加载中...</span>
        </div>
    </nav>

    <div class="main-container">
        <aside class="sidebar-left">
            <div class="sidebar-header">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" placeholder="搜索 API..." id="search-input">
                </div>
            </div>
            <div class="api-tree" id="api-tree"></div>
        </aside>

        <main class="content-main">
            <div class="content-wrapper" id="content-wrapper">
                <div class="doc-header">
                    <div class="method-path">
                        <span class="method-badge method-get">GET</span>
                        <span class="path">/health</span>
                    </div>
                    <h1>健康检查</h1>
                    <p class="description">用于监控服务器状态的健康检查接口，返回服务器的运行状态、时间戳和运行时间。</p>
                </div>

                <div class="doc-section">
                    <h2><i class="fas fa-arrow-right"></i>请求参数</h2>
                    <div class="empty-state">该接口无需请求参数</div>
                </div>

                <div class="doc-section">
                    <h2><i class="fas fa-arrow-down"></i>返回结果</h2>
                    <div class="code-wrapper">
                        <div class="code-header">
                            <div class="code-tabs">
                                <button class="code-tab active">JSON</button>
                            </div>
                            <div class="code-actions">
                                <button class="code-action-btn" onclick="copyCode(this)">
                                    <i class="fas fa-copy"></i> 复制
                                </button>
                            </div>
                        </div>
                        <div class="code-block">

        function toggleParam(index) {

        function updateParamValue(index, value) {

        function sendRequest() {
            const method = document.getElementById('method-select').value;
            let url = document.getElementById('url-input').value;
            const token = document.getElementById('token-input')?.value || '';

            switchTab('response');
            const testContent = document.getElementById('test-content');
            const startTime = Date.now();

            // 处理Socket.IO事件
            if (method === 'SOCKET') {
                const active = getActiveSocket();
                let targetSocket = active.socket;
                let isConnected = active.connected;
                const namespace = active.namespace;

                // 未连接时自动连接
                if (!isConnected || !targetSocket) {
                    testContent.innerHTML = `
                        <div class="response-panel">
                            <div class="response-info">
                                <span class="status-warning">正在连接...</span>
                                <span class="time-info">${Date.now() - startTime}ms</span>
                            </div>
                            <div class="code-wrapper">
                                <div class="code-header">
                                    <div class="code-tabs">
                                        <button class="code-tab active">连接中</button>
                                    </div>
                                </div>
                                <div class="code-block">
                                    <pre><code>正在连接到 Socket.IO${namespace === '/admin' ? ' (/admin)' : ''}...</code></pre>
                                </div>
                            </div>
                        </div>
                    `;
                    if (typeof Prism !== 'undefined') {
                        Prism.highlightAll();
                    }

                    const newSocket = connectSocket(namespace === '/admin' ? '/admin' : undefined);
                    if (!newSocket) {
                        testContent.innerHTML = `
                            <div class="response-panel">
                                <div class="response-info">
                                    <span class="status-error">连接失败</span>
                                    <span class="time-info">${Date.now() - startTime}ms</span>
                                </div>
                                <div class="code-wrapper">
                                    <div class="code-header">
                                        <div class="code-tabs">
                                            <button class="code-tab active">Error</button>
                                        </div>
                                    </div>
                                    <div class="code-block">
                                        <pre><code>无法连接到服务器，请确保服务器正在运行</code></pre>
                                    </div>
                                </div>
                            </div>
                        `;
                        if (typeof Prism !== 'undefined') {
                            Prism.highlightAll();
                        }
                        return;
                    }

                    // 等待连接成功后再发送
                    const waitConnect = setInterval(() => {
                        const check = getActiveSocket();
                        if (check.connected && check.socket) {
                            clearInterval(waitConnect);
                            doSocketEmit(check.socket, startTime);
                        }
                    }, 200);

                    // 10秒超时
                    setTimeout(() => {
                        clearInterval(waitConnect);
                        const check = getActiveSocket();
                        if (!check.connected) {
                            testContent.innerHTML = `
                                <div class="response-panel">
                                    <div class="response-info">
                                        <span class="status-error">连接超时</span>
                                        <span class="time-info">${Date.now() - startTime}ms</span>
                                    </div>
                                    <div class="code-wrapper">
                                        <div class="code-header">
                                            <div class="code-tabs">
                                                <button class="code-tab active">Error</button>
                                            </div>
                                        </div>
                                        <div class="code-block">
                                            <pre><code>连接超时，请检查服务器是否正在运行</code></pre>
                                        </div>
                                    </div>
                                </div>
                            `;
                            if (typeof Prism !== 'undefined') {
                                Prism.highlightAll();
                            }
                        }
                    }, 10000);
                    return;
                }

                doSocketEmit(targetSocket, startTime);
                return;
            }

            // Socket.IO 真实发送函数
            function doSocketEmit(targetSocket, startTime) {
                try {
                    const params = {};
                    requestParams.forEach(p => {
                        if (p.enabled && p.key) {
                            params[p.key] = p.value;
                        }
                    });

                    targetSocket.emit(currentApi.path, params);

                    const testContent = document.getElementById('test-content');
                    testContent.innerHTML = `
                        <div class="response-panel">
                            <div class="response-info">
                                <span class="status-success">事件已发送</span>
                                <span class="time-info">${Date.now() - startTime}ms</span>
                            </div>
                            <div class="code-wrapper">
                                <div class="code-header">
                                    <div class="code-tabs">
                                        <button class="code-tab active">emit: ${currentApi.path}</button>
                                    </div>
                                </div>
                                <div class="code-block">
                                    <pre><code class="language-json">${escapeHtml(JSON.stringify(params, null, 2))}</code></pre>
                                </div>
                            </div>
                            <div style="margin-top: 12px; padding: 12px; background-color: var(--bg-tertiary); border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px; color: var(--text-secondary);">
                                <strong style="color: var(--text-primary);">等待服务器响应...</strong><br>
                                • 收到事件后将自动显示在此处
                            </div>
                        </div>
                    `;
                    if (typeof Prism !== 'undefined') {
                        Prism.highlightAll();
                    }
                } catch (error) {
                    const testContent = document.getElementById('test-content');
                    testContent.innerHTML = `
                        <div class="response-panel">
                            <div class="response-info">
                                <span class="status-error">发送失败</span>
                                <span class="time-info">${Date.now() - startTime}ms</span>
                            </div>
                            <div class="code-wrapper">
                                <div class="code-header">
                                    <div class="code-tabs">
                                        <button class="code-tab active">Error</button>
                                    </div>
                                </div>
                                <div class="code-block">
                                    <pre><code class="language-json">${escapeHtml(error.message)}</code></pre>
                                </div>
                            </div>
                        </div>
                    `;
                    if (typeof Prism !== 'undefined') {
                        Prism.highlightAll();
                    }
                }
            }

            // 处理HTTP请求
            const headers = {};
            requestHeaders.filter(h => h.enabled && h.key).forEach(h => {
                headers[h.key] = h.value;
            });

            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const options = {
                method: method,
                headers: headers
            };

            const enabledParams = requestParams.filter(p => p.enabled && p.key);

            // POST/PUT：将 params 以 JSON body 发送（如果未手动填写 body）
            if ((method === 'POST' || method === 'PUT') && enabledParams.length > 0 && !requestBody) {
                const bodyObj = {};
                enabledParams.forEach(p => {
                    bodyObj[p.key] = p.value;
                });
                options.body = JSON.stringify(bodyObj);
                if (!headers['Content-Type']) {
                    headers['Content-Type'] = 'application/json';
                }
            } else if (enabledParams.length > 0) {
                // GET/DELETE 或其他：params 作为 query string
                const queryString = enabledParams.map(p => `${encodeURIComponent(p.key)}=${encodeURIComponent(p.value)}`).join('&');
                url += (url.includes('?') ? '&' : '?') + queryString;
            }

            if (requestBody && (method === 'POST' || method === 'PUT')) {
                options.body = requestBody;
            }

            fetch(url, options)
                .then(response => {
                    const endTime = Date.now();
                    const duration = endTime - startTime;

                    return response.text().then(text => {
                        let jsonData;
                        try {
                            jsonData = JSON.parse(text);
                            text = JSON.stringify(jsonData, null, 2);
                        } catch (e) {
                        }

                        const statusClass = response.ok ? 'status-success' : 'status-error';
                        testContent.innerHTML = `
                            <div class="response-panel">
                                <div class="response-info">
                                    <span class="${statusClass}">${response.status} ${response.statusText}</span>
                                    <span class="time-info">${duration}ms</span>
                                    <div class="response-actions">
                                        <button class="response-action-btn" onclick="copyCode(this)">
                                            <i class="fas fa-copy"></i> 复制
                                        </button>
                                    </div>
                                </div>
                                <div class="code-wrapper">
                                    <div class="code-header">
                                        <div class="code-tabs">
                                            <button class="code-tab active">Response</button>
                                        </div>
                                    </div>
                                    <div class="code-block">
                                        <pre><code class="language-json">${escapeHtml(text)}</code></pre>
                                    </div>
                                </div>
                            </div>
                        `;

                        if (typeof Prism !== 'undefined') {
                            Prism.highlightAll();
                        }
                    });
                })
                .catch(error => {
                    const endTime = Date.now();
                    const duration = endTime - startTime;

                    testContent.innerHTML = `
                        <div class="response-panel">
                            <div class="response-info">
                                <span class="status-error">请求失败</span>
                                <span class="time-info">${duration}ms</span>
                            </div>
                            <div class="code-wrapper">
                                <div class="code-header">
                                    <div class="code-tabs">
                                        <button class="code-tab active">Error</button>
                                    </div>
                                </div>
                                <div class="code-block">
                                    <pre><code class="language-json">${escapeHtml(error.message)}</code></pre>
                                </div>
                            </div>
                        </div>
                    `;
                });
        }

        function saveToken() {
            const token = document.getElementById('token-input').value;
            if (token) {
                localStorage.setItem('adminToken', token);
                alert('Token 已保存到本地存储');
            }
        }

        function loadToken() {
            const token = localStorage.getItem('adminToken');
            if (token) {
                document.getElementById('token-input').value = token;
            } else {
                alert('本地存储中没有找到 Token');
            }
        }

        function connectSocket(namespace) {
            const isAdmin = namespace === '/admin';
            const targetSocket = isAdmin ? adminSocket : socket;
            const connected = isAdmin ? adminConnected : socketConnected;
            const token = document.getElementById('token-input')?.value || '';
            const socketUrl = 'http://localhost:8080' + (namespace || '');

            // 如果是/admin命名空间且已有连接，先断开
            if (isAdmin && adminSocket) {
                adminSocket.disconnect();
                adminSocket = null;
                adminConnected = false;
            }
            // 如果不是/admin且已有连接，先断开
            if (!isAdmin && socket) {
                socket.disconnect();
                socket = null;
                socketConnected = false;
            }

            try {
                const newSocket = io(socketUrl, {
                    query: { token: token },
                    transports: ['websocket', 'polling']
                });

                newSocket.on('connect', () => {
                    console.log(`Socket.IO${isAdmin ? ' (/admin)' : ''} 连接成功`);
                    if (isAdmin) {
                        adminConnected = true;
                        updateSocketStatus(true);
                    } else {
                        socketConnected = true;
                        updateSocketStatus(true);
                    }
                });

                newSocket.on('disconnect', () => {
                    console.log(`Socket.IO${isAdmin ? ' (/admin)' : ''} 连接断开`);
                    if (isAdmin) {
                        adminConnected = false;
                        updateSocketStatus(false);
                    } else {
                        socketConnected = false;
                        updateSocketStatus(false);
                    }
                });

                newSocket.on('connect_error', (error) => {
                    console.error(`Socket.IO${isAdmin ? ' (/admin)' : ''} 连接失败:`, error.message);
                    if (isAdmin) {
                        adminConnected = false;
                        updateSocketStatus(false);
                    } else {
                        socketConnected = false;
                        updateSocketStatus(false);
                    }
                });

                // 通用监听 - 捕获所有服务器返回的事件
                newSocket.onAny((event, ...args) => {
                    const data = args[0] || {};
                    console.log(`Socket.IO 收到事件 [${event}]:`, data);
                    handleSocketResponse(event, data);
                });

                if (isAdmin) {
                    adminSocket = newSocket;
                } else {
                    socket = newSocket;
                }

                return newSocket;
            } catch (err) {
                console.error('Socket.IO 创建失败:', err);
                if (isAdmin) {
                    adminConnected = false;
                } else {
                    socketConnected = false;
                }
                updateSocketStatus(false);
                return null;
            }
        }

        function getActiveSocket() {
            const adminCategories = [
                'Socket.IO - 管理员 (/admin)',
                '管理员API',
                '账号管理API',
                '系统管理API',
                '更新系统API',
                '商店/商城API',
                '头像管理API',
                '反馈系统API'
            ];
            const currentCategoryName = currentApi._categoryName || '';
            if (adminCategories.includes(currentCategoryName)) {
                return { socket: adminSocket, connected: adminConnected, namespace: '/admin' };
            }
            return { socket: socket, connected: socketConnected, namespace: 'main' };
        }

        function updateSocketStatus(connected) {
            // 更新认证页面的状态
            const testContent = document.getElementById('test-content');
            const authSection = testContent.querySelector('.auth-section');
            if (authSection) {
                const statusElement = authSection.querySelector('.socket-status');
                if (statusElement) {
                    statusElement.innerHTML = connected
                        ? '<span style="color: var(--success-text);"><i class="fas fa-check-circle"></i> 已连接</span>'
                        : '<span style="color: var(--error-text);"><i class="fas fa-times-circle"></i> 未连接</span>';
                } else {
                    const statusDiv = document.createElement('div');
                    statusDiv.className = 'socket-status';
                    statusDiv.style.marginTop = '8px';
                    statusDiv.innerHTML = connected
                        ? '<span style="color: var(--success-text);"><i class="fas fa-check-circle"></i> 已连接</span>'
                        : '<span style="color: var(--error-text);"><i class="fas fa-times-circle"></i> 未连接</span>';
                    authSection.appendChild(statusDiv);
                }
            }

            // 在测试面板顶部添加连接状态指示器
            const methodSelect = document.getElementById('method-select');
            if (methodSelect) {
                let statusIndicator = document.getElementById('socket-status-indicator');
                if (!statusIndicator) {
                    statusIndicator = document.createElement('div');
                    statusIndicator.id = 'socket-status-indicator';
                    statusIndicator.style.position = 'absolute';
                    statusIndicator.style.top = '12px';
                    statusIndicator.style.right = '12px';
                    statusIndicator.style.fontSize = '12px';
                    statusIndicator.style.padding = '4px 8px';
                    statusIndicator.style.borderRadius = '4px';
                    statusIndicator.style.fontWeight = '500';
                    methodSelect.parentElement.style.position = 'relative';
                    methodSelect.parentElement.appendChild(statusIndicator);
                }
                statusIndicator.innerHTML = connected
                    ? '<span style="color: var(--success-text);"><i class="fas fa-check-circle"></i> Socket已连接</span>'
                    : '<span style="color: var(--error-text);"><i class="fas fa-times-circle"></i> Socket未连接</span>';
                statusIndicator.style.backgroundColor = connected ? 'rgba(72, 187, 120, 0.1)' : 'rgba(229, 62, 62, 0.1)';
            }
        }

        function handleSocketResponse(event, data) {
            switchTab('response');
            const testContent = document.getElementById('test-content');
            const endTime = Date.now();

            testContent.innerHTML = `
                <div class="response-panel">
                    <div class="response-info">
                        <span class="status-success">Socket.IO 响应</span>
                        <span class="time-info">${new Date().toLocaleTimeString()}</span>
                        <div class="response-actions">
                            <button class="response-action-btn" onclick="copyCode(this)">
                                <i class="fas fa-copy"></i> 复制
                            </button>
                        </div>
                    </div>
                    <div class="code-wrapper">
                        <div class="code-header">
                            <div class="code-tabs">
                                <button class="code-tab active">事件: ${event}</button>
                            </div>
                        </div>
                        <div class="code-block">
                            <pre><code class="language-json">${escapeHtml(JSON.stringify(data, null, 2))}</code></pre>
                        </div>
                    </div>
                </div>
            `;

            if (typeof Prism !== 'undefined') {
                Prism.highlightAll();
            }
        }

        function fetchVersion() {
            fetch('/version')
                .then(response => response.json())
                .then(data => {
                    if (data.version) {
                        document.getElementById('version-badge').textContent = 'v' + data.version;
                    }
                })
                .catch(error => {
                    console.error('获取版本信息失败:', error);
                });
        }

        function initTestTabs() {
            document.querySelectorAll('.test-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    switchTab(tab.dataset.tab);
                });
            });
        }

        window.onload = function () {
            initApiTree();
            initSearch();
            initTestTabs();
            fetchVersion();

            if (typeof Prism !== 'undefined') {
                Prism.highlightAll();
            }

            const savedToken = localStorage.getItem('adminToken');
            if (savedToken) {
                const tokenInput = document.getElementById('token-input');
                if (tokenInput) {
                    tokenInput.value = savedToken;
                    // 自动尝试连接Socket.IO
                    connectSocket();
                }
            }

            // 监听方法选择变化
            const methodSelect = document.getElementById('method-select');
            if (methodSelect) {
                methodSelect.addEventListener('change', function () {
                    if (this.value === 'SOCKET' && !socketConnected) {
                        alert('请先点击"连接 Socket"按钮建立WebSocket连接');
                    }
                });
            }

            requestParams = currentApi.params ? currentApi.params.map(p => ({ key: p.name, value: p.default || '', enabled: true })) : [];
            requestHeaders = [{ key: 'Content-Type', value: 'application/json', enabled: true }];
        };
    </script>
