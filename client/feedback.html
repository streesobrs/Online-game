<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007bff">
  <title>帮助/反馈 - 多棋种联机大厅</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.25s ease;
    }

    body {
      font-family: 'Microsoft Yahei', Arial, sans-serif;
      background: #f0f2f5;
      color: #2d3748;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== 顶部导航 ===== */
    .game-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      background: white;
      padding: 8px 16px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      width: 100%;
      max-width: 1100px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      background: #f8f9fa;
      color: #495057;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      background: #e9ecef;
      transform: translateY(-2px);
    }

    .nav-btn.active {
      background: #007bff;
      color: white;
    }

    .nav-btn.active:hover {
      background: #0056b3;
    }

    /* ===== 主容器 ===== */
    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 16px;
    }

    /* ===== 页面标题 ===== */
    .page-header {
      background: white;
      padding: 24px 28px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      margin-bottom: 16px;
      grid-column: 1 / -1;
    }

    .page-header h1 {
      font-size: 28px;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== 提价反馈表单 ===== */
    .submit-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      height: fit-content;
    }

    .submit-card h2 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #2d3748;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #495057;
    }

    .form-group select,
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    .form-group select:focus,
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #007bff;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #0056b3;
    }

    .submit-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }

    /* ===== 反馈列表 ===== */
    .feedbacks-list {
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 8px;
      padding: 0 20px;
    }

    .feedback-card {
      background: white;
      padding: 20px 0;
      border-bottom: 1px solid #f1f2f3;
    }

    .feedback-header {
      display: flex;
      gap: 12px;
    }

    /* 反馈头像 */
    .feedback-avatar {
      flex-shrink: 0;
    }

    /* 反馈主体 */
    .feedback-main {
      flex: 1;
      min-width: 0;
    }

    .feedback-title {
      font-size: 16px;
      font-weight: 600;
      color: #18191c;
      margin-bottom: 4px;
    }

    .feedback-meta {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-direction: column;
      align-items: flex-end;
    }

    .feedback-type {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .type-bug {
      background: #ffeaea;
      color: #dc3545;
    }

    .type-feature {
      background: #e3f2fd;
      color: #1976d2;
    }

    .type-question {
      background: #fff3e0;
      color: #f57c00;
    }

    .type-other {
      background: #f5f5f5;
      color: #616161;
    }

    .feedback-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-pending {
      background: #fff3e0;
      color: #f57c00;
    }

    .status-processing {
      background: #e3f2fd;
      color: #1976d2;
    }

    .status-resolved {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status-closed {
      background: #f5f5f5;
      color: #616161;
    }

    .feedback-author {
      font-size: 13px;
      color: #9499a0;
      margin-bottom: 8px;
    }

    .feedback-content {
      margin-bottom: 12px;
      line-height: 1.6;
      color: #61666d;
      font-size: 14px;
    }

    .feedback-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .vote-btn,
    .toggle-comments-btn {
      padding: 6px 16px;
      border: 1px solid #e7e7e7;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #9499a0;
    }

    .vote-btn:hover,
    .toggle-comments-btn:hover {
      border-color: #00a1d6;
      color: #00a1d6;
    }

    .vote-btn.voted {
      background: #e3f5ff;
      border-color: #00a1d6;
      color: #00a1d6;
    }

    .vote-count {
      font-weight: normal;
    }

    /* ===== 评论区 ===== */
    .comments-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e9ecef;
      display: none;
    }

    .comments-section.open {
      display: block;
    }

    .add-comment {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .add-comment input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e3e5e7;
      border-radius: 6px;
      background: #f1f2f3;
      font-size: 14px;
    }

    .add-comment input:focus {
      outline: none;
      border-color: #00a1d6;
      background: white;
    }

    .add-comment button {
      padding: 10px 20px;
      background: #00a1d6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-comment button:hover {
      background: #008ebd;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
    }

    .comment-item {
      background: white;
      padding: 12px 0;
      border-bottom: 1px solid #f1f2f3;
      display: flex;
      gap: 12px;
    }

    /* 回复 - B站风格 */
    .comment-item.comment-nested {
      margin: 0;
      padding: 10px 0;
      background: transparent;
      border-left: none;
      border-radius: 0;
      border-bottom: none;
    }

    /* 头像 */
    .comment-avatar {
      flex-shrink: 0;
    }

    .avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00a1d6, #00d4a8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500;
    }

    /* 回复里的头像更小 */
    .comment-item.comment-nested .avatar-circle {
      width: 32px;
      height: 32px;
      font-size: 13px;
    }

    /* 评论主体 */
    .comment-main {
      flex: 1;
      min-width: 0;
    }

    /* @用户 */
    .at-user {
      color: #00a1d6;
      font-weight: 500;
    }

    /* 回复容器 */
    .replies-container {
      margin-top: 8px;
      background: #f1f2f3;
      padding: 0 12px;
      border-radius: 4px;
    }

    /* 查看更多按钮 */
    .view-more-btn {
      background: none;
      border: none;
      color: #757575;
      cursor: pointer;
      padding: 8px 0;
      font-size: 13px;
      display: block;
      width: 100%;
      text-align: left;
    }

    .view-more-btn:hover {
      color: #00a1d6;
    }

    .comment-author {
      font-weight: 500;
      color: #61666d;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .comment-content {
      color: #18191c;
      line-height: 1.6;
      font-size: 14px;
    }

    .comment-actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      align-items: center;
    }

    .comment-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #9499a0;
      padding: 4px 0;
      margin-right: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .comment-actions button:hover {
      color: #00a1d6;
    }

    .comment-actions .comment-liked {
      color: #00a1d6;
    }

    .comment-time {
      font-size: 12px;
      color: #9499a0;
      margin-left: auto;
    }

    .comment-reply-input {
      display: flex;
      gap: 10px;
      margin: 8px 0;
    }

    .comment-reply-input input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e3e5e7;
      border-radius: 6px;
      background: #f1f2f3;
      font-size: 13px;
    }

    .comment-reply-input input:focus {
      outline: none;
      border-color: #00a1d6;
      background: white;
    }

    .comment-reply-input button {
      padding: 8px 20px;
      background: #00a1d6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .comment-reply-input button:hover {
      background: #00a1d6;
      opacity: 0.8;
    }



    /* ===== 加载状态 ===== */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
      grid-column: 1 / -1;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e9ecef;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* ===== 空状态 ===== */
    .empty-state {
      background: white;
      padding: 60px 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      text-align: center;
      color: #6c757d;
      grid-column: 1 / -1;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- 导航栏 -->
  <div class="game-nav">
    <button class="nav-btn" onclick="window.location.href='/'">🏠 游戏大厅</button>
    <button class="nav-btn" onclick="window.location.href='/profile.html'">👤 个人资料</button>
    <button class="nav-btn" onclick="window.location.href='/games-history.html'">📊 游戏记录</button>
    <button class="nav-btn" onclick="window.location.href='/shop.html'">🛒 星钻消费</button>
    <button class="nav-btn active">💬 帮助/反馈</button>
  </div>

  <div class="container">

    <!-- 页面标题 -->
    <div class="page-header">
      <h1>💬 帮助/反馈</h1>
    </div>

    <!-- 加载状态 -->
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      <div>加载中...</div>
    </div>

    <!-- 提交反馈表单 -->
    <div class="submit-card" id="submitCard" style="display: none;">
      <h2>📝 提交反馈</h2>
      <div class="form-group">
        <label>反馈类型</label>
        <select id="feedbackType">
          <option value="bug">Bug 反馈</option>
          <option value="feature">功能建议</option>
          <option value="question">问题咨询</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>标题</label>
        <input type="text" id="feedbackTitle" placeholder="简要描述您的反馈">
      </div>
      <div class="form-group">
        <label>详细内容</label>
        <textarea id="feedbackContent" placeholder="请详细描述您的问题或建议..."></textarea>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="submitFeedback()">提交反馈</button>
    </div>

    <!-- 反馈列表 -->
    <div class="feedbacks-list" id="feedbacksList" style="display: none;"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">💬</div>
      <h3>还没有任何反馈</h3>
      <p>成为第一个提交反馈的人吧！</p>
    </div>

  </div>

  <script>
    const socket = io({
      transports: ['websocket'],
      reconnection: true,
      reconnectionAttempts: 3,
      reconnectionDelay: 2000
    });
    let userToken = null;
    let currentAccountId = null;
    let currentNickname = null;
    let feedbacks = [];

    // 类型配置
    const typeConfig = {
      bug: { label: 'Bug 反馈', class: 'type-bug' },
      feature: { label: '功能建议', class: 'type-feature' },
      question: { label: '问题咨询', class: 'type-question' },
      other: { label: '其他', class: 'type-other' }
    };

    const statusConfig = {
      pending: { label: '待处理', class: 'status-pending' },
      processing: { label: '处理中', class: 'status-processing' },
      resolved: { label: '已解决', class: 'status-resolved' },
      closed: { label: '已关闭', class: 'status-closed' }
    };

    // Socket事件：获取用户信息
    socket.on('account_info', (result) => {
      if (result?.success && result.data) {
        const account = result.data.account?.account || result.data.account;
        if (account) {
          currentAccountId = account.id;
          currentNickname = account.nickname || account.username || '玩家';
          localStorage.setItem('currentAccountId', currentAccountId);
          localStorage.setItem('nickname', currentNickname);
        }
      }
    });

    // Socket事件监听
    socket.on('feedbacks_list', (data) => {
      feedbacks = data.feedbacks;
      const list = document.getElementById('feedbacksList');
      if (list.style.display !== 'none') {
        renderFeedbacks();
      }
    });

    socket.on('feedback_submitted', () => {
      alert('反馈提交成功！');
      document.getElementById('feedbackTitle').value = '';
      document.getElementById('feedbackContent').value = '';
    });

    socket.on('error', (data) => {
      alert(data.message);
    });

    // 页面关闭时断开 socket
    window.addEventListener('beforeunload', () => {
      socket.disconnect();
    });

    // 初始化
    window.onload = async () => {
      userToken = localStorage.getItem('userToken');
      currentAccountId = localStorage.getItem('currentAccountId');
      currentNickname = localStorage.getItem('nickname');

      if (!userToken) {
        alert('请先登录！');
        window.location.href = '/';
        return;
      }

      // 始终通过Socket获取用户信息以建立服务端会话
      const token = localStorage.getItem('userToken');
      if (token) {
        socket.emit('get_account_by_token', { token });
      }

      // 先通过fetch加载反馈列表
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('submitCard').style.display = 'block';
      await loadFeedbacks();
    };

    // 加载反馈列表
    async function loadFeedbacks() {
      try {
        const res = await fetch('/api/feedbacks');
        const data = await res.json();
        if (data.success) {
          feedbacks = data.data;
          renderFeedbacks();
        }
      } catch (err) {
        console.error('加载反馈失败:', err);
      }
    }

    // 提交反馈
    async function submitFeedback() {
      const type = document.getElementById('feedbackType').value;
      const title = document.getElementById('feedbackTitle').value.trim();
      const content = document.getElementById('feedbackContent').value.trim();

      if (!title || !content) {
        alert('请填写标题和内容');
        return;
      }

      if (!currentAccountId) {
        alert('请先登录！');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/feedbacks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accountId: currentAccountId,
            nickname: currentNickname || '玩家',
            type,
            title,
            content
          })
        });
        const data = await res.json();
        if (data.success) {
          alert('反馈提交成功！');
          document.getElementById('feedbackTitle').value = '';
          document.getElementById('feedbackContent').value = '';
          loadFeedbacks();
        } else {
          alert(data.message || '提交失败');
        }
      } catch (err) {
        console.error('提交反馈失败:', err);
        alert('提交失败，请重试');
      } finally {
        submitBtn.disabled = false;
      }
    }

    // 渲染反馈列表
    function renderFeedbacks() {
      const list = document.getElementById('feedbacksList');
      const emptyState = document.getElementById('emptyState');
      const loadingState = document.getElementById('loadingState');

      // 保存展开状态
      const openSections = new Set();
      document.querySelectorAll('.comments-section.open').forEach(el => {
        openSections.add(el.id);
      });
      const openReplyInputs = new Set();
      document.querySelectorAll('.comment-reply-input[style*="flex"]').forEach(el => {
        openReplyInputs.add(el.id);
      });

      loadingState.style.display = 'none';

      if (feedbacks.length === 0) {
        list.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      list.style.display = 'flex';
      list.innerHTML = '';

      // 递归计算所有评论（包括嵌套回复）
      function countAllComments(comments) {
        if (!comments || comments.length === 0) return 0;
        return comments.reduce((sum, c) => sum + 1 + countAllComments(c.replies), 0);
      }

      feedbacks.forEach(feedback => {
        const type = typeConfig[feedback.type] || typeConfig.other;
        const status = statusConfig[feedback.status] || statusConfig.pending;
        const voteCount = feedback.votes?.length || 0;
        const hasVoted = feedback.votes?.some(v => v.accountId === currentAccountId);
        // 评论总数（含所有楼中楼回复）
        const totalComments = countAllComments(feedback.comments);

        const card = document.createElement('div');
        card.className = 'feedback-card';
        card.innerHTML = `
          <div class="feedback-header">
            <div class="feedback-avatar">
              <div class="avatar-circle">${escapeHtml(feedback.nickname).charAt(0)}</div>
            </div>
            <div class="feedback-main">
              <div class="feedback-title">${escapeHtml(feedback.title)}</div>
              <div class="feedback-author">
                ${escapeHtml(feedback.nickname)} · ${formatDate(feedback.createdAt)}
              </div>
              <div class="feedback-content">${escapeHtml(feedback.content)}</div>
              <div class="feedback-actions">
                <button class="vote-btn ${hasVoted ? 'voted' : ''}" onclick="voteFeedback('${feedback.id}')">
                  👍 <span class="vote-count">${voteCount}</span>
                </button>
                <button class="toggle-comments-btn" onclick="toggleComments('${feedback.id}')">
                  💬 ${totalComments} 条评论
                </button>
              </div>
            </div>
            <div class="feedback-meta">
              <span class="feedback-type ${type.class}">${type.label}</span>
              <span class="feedback-status ${status.class}">${status.label}</span>
            </div>
          </div>
          <div class="comments-section" id="comments-${feedback.id}">
            <div class="add-comment">
              <input type="text" id="comment-input-${feedback.id}" placeholder="写下你的评论...">
              <button onclick="addComment('${feedback.id}')">发送</button>
            </div>
            <div class="comments-list" id="comments-list-${feedback.id}">
              ${renderComments(feedback.comments || [], feedback.id)}
            </div>
          </div>
        `;

        list.appendChild(card);
      });

      // 恢复展开状态
      openSections.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('open');
      });
      openReplyInputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'flex';
      });
    }

    // 渲染评论和回复 - B站风格：可展开/收起
    function renderComments(comments, feedbackId) {
      if (!comments || comments.length === 0) {
        return '<div style="color: #6c757d; text-align: center; padding: 20px;">暂无评论</div>';
      }

      let html = '';

      // 遍历每条主评论
      comments.forEach(comment => {
        html += renderSingleComment(comment, feedbackId, false);

        // 收集该评论的所有回复，同时记录根评论的昵称
        const allReplies = [];
        const rootNickname = comment.nickname;
        collectReplies(comment, allReplies, comment.nickname);

        if (allReplies.length > 0) {
          const listId = `replies-${feedbackId}-${comment.id}`;
          const btnId = `toggle-btn-${feedbackId}-${comment.id}`;

          // 回复容器
          html += `<div class="replies-container" id="${listId}">`;

          // 默认只显示前2条回复
          const showCount = Math.min(2, allReplies.length);
          for (let i = 0; i < showCount; i++) {
            // 只有当回复不是直接回复根评论时，才显示@
            const showAt = allReplies[i].replyToNickname !== rootNickname;
            html += renderSingleComment(allReplies[i].reply, feedbackId, true, showAt ? allReplies[i].replyToNickname : null);
          }

          // 隐藏的回复（超过2条的部分）
          if (allReplies.length > 2) {
            html += `<div class="hidden-replies" style="display: none;">`;
            for (let i = 2; i < allReplies.length; i++) {
              // 只有当回复不是直接回复根评论时，才显示@
              const showAt = allReplies[i].replyToNickname !== rootNickname;
              html += renderSingleComment(allReplies[i].reply, feedbackId, true, showAt ? allReplies[i].replyToNickname : null);
            }
            html += `</div>`;

            // 查看更多按钮
            html += `<button class="view-more-btn" id="${btnId}" onclick="toggleReplies('${listId}', '${btnId}', ${allReplies.length})">
              共${allReplies.length}条回复，点击查看
            </button>`;
          }

          html += `</div>`;
        }
      });

      return html;

      // 递归收集所有回复
      function collectReplies(node, result, replyToNickname) {
        if (node.replies && node.replies.length > 0) {
          node.replies.forEach(reply => {
            result.push({ reply, replyToNickname });
            collectReplies(reply, result, reply.nickname);
          });
        }
      }
    }

    // 切换回复展开/收起
    function toggleReplies(listId, btnId, totalCount) {
      const container = document.getElementById(listId);
      const btn = document.getElementById(btnId);
      const hiddenReplies = container.querySelector('.hidden-replies');

      if (hiddenReplies.style.display === 'none') {
        hiddenReplies.style.display = 'block';
        btn.textContent = '收起回复';
      } else {
        hiddenReplies.style.display = 'none';
        btn.textContent = `共${totalCount}条回复，点击查看`;
      }
    }


    // 渲染单条评论/回复 - B站风格，带头像
    function renderSingleComment(node, feedbackId, isNested, replyToNickname) {
      const liked = node.likes && node.likes.indexOf(currentAccountId) !== -1;
      const isOwner = node.accountId === currentAccountId;
      const nodeId = node.id;
      const levelClass = isNested ? 'comment-nested' : '';

      // 如果是回复，添加 @被回复用户
      let content = escapeHtml(node.content);
      if (isNested && replyToNickname) {
        content = `<span class="at-user">@${escapeHtml(replyToNickname)}</span> ${content}`;
      }

      return `
        <div class="comment-item ${levelClass}">
          <div class="comment-avatar">
            <div class="avatar-circle">${escapeHtml(node.nickname).charAt(0)}</div>
          </div>
          <div class="comment-main">
            <div class="comment-author">${escapeHtml(node.nickname)}</div>
            <div class="comment-content">${content}</div>
            <div class="comment-actions">
              <span class="comment-time">${formatDate(node.createdAt)}</span>
              <button class="${liked ? 'comment-liked' : ''}" onclick="likeComment('${feedbackId}','${nodeId}')">
                👍 ${(node.likes && node.likes.length) || 0}
              </button>
              <button onclick="showReplyInput('${feedbackId}','${nodeId}')">回复</button>
              ${isOwner ? `<button onclick="deleteComment('${feedbackId}','${nodeId}')">删除</button>` : ''}
            </div>
            <div class="comment-reply-input" id="reply-input-${feedbackId}-${nodeId}" style="display:none;">
              <input type="text" id="reply-content-${feedbackId}-${nodeId}" placeholder="回复 ${escapeHtml(node.nickname)}..." onkeydown="if(event.key==='Enter')sendReply('${feedbackId}','${nodeId}')">
              <button onclick="sendReply('${feedbackId}','${nodeId}')">发送</button>
            </div>
          </div>
        </div>
      `;
    }

    // 投票
    async function voteFeedback(feedbackId) {
      if (!currentAccountId) { alert('请先登录！'); return; }
      socket.emit('vote_feedback', { feedbackId, voteType: 'up' });
    }

    // 监听投票结果
    socket.on('feedback_voted', () => {
      loadFeedbacks();
    });

    // 切换评论区
    function toggleComments(feedbackId) {
      const section = document.getElementById(`comments-${feedbackId}`);
      section.classList.toggle('open');
    }

    // 添加评论
    async function addComment(feedbackId) {
      const input = document.getElementById(`comment-input-${feedbackId}`);
      const content = input.value.trim();
      if (!content) { alert('请输入评论内容'); return; }
      if (!currentAccountId) { alert('请先登录！'); return; }
      input.value = '';
      socket.emit('add_comment', { feedbackId, content });
    }

    // 监听评论结果
    socket.on('comment_added', () => {
      loadFeedbacks();
    });

    // 楼中楼回复
    function showReplyInput(feedbackId, commentId) {
      const el = document.getElementById(`reply-input-${feedbackId}-${commentId}`);
      if (el) {
        el.style.display = el.style.display === 'none' ? 'flex' : 'none';
        if (el.style.display === 'flex') el.querySelector('input').focus();
      }
    }

    function sendReply(feedbackId, commentId) {
      const input = document.getElementById(`reply-content-${feedbackId}-${commentId}`);
      const content = input.value.trim();
      if (!content) return;
      if (!currentAccountId) { alert('请先登录！'); return; }
      socket.emit('reply_comment', { feedbackId, commentId, content });
      input.value = '';
      // 发送后收起回复框
      const el = document.getElementById(`reply-input-${feedbackId}-${commentId}`);
      if (el) el.style.display = 'none';
    }

    // 评论点赞
    function likeComment(feedbackId, commentId) {
      if (!currentAccountId) { alert('请先登录！'); return; }
      socket.emit('like_comment', { feedbackId, commentId });
    }

    // 删除评论/回复（节点ID全局唯一）
    function deleteComment(feedbackId, nodeId) {
      if (!currentAccountId) return;
      if (!confirm('确定删除吗？')) return;
      socket.emit('delete_comment', { feedbackId, commentId: nodeId });
    }

    // HTML转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 格式化日期
    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;

      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
      if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';

      return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
  </script>

</body>
