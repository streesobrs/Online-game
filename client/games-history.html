<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007bff">
  <title>游戏记录 - 多棋种联机大厅</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.25s ease;
    }

    body {
      font-family: 'Microsoft Yahei', Arial, sans-serif;
      background: #f0f2f5;
      color: #2d3748;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== 顶部导航 ===== */
    .game-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      background: white;
      padding: 8px 16px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      width: 100%;
      max-width: 1100px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      background: #f8f9fa;
      color: #495057;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      background: #e9ecef;
      transform: translateY(-2px);
    }

    .nav-btn.active {
      background: #007bff;
      color: white;
    }

    .nav-btn.active:hover {
      background: #0056b3;
    }

    /* ===== 主容器 ===== */
    .container {
      width: 100%;
      max-width: 1100px;
    }

    /* ===== 页面标题 ===== */
    .page-header {
      background: white;
      padding: 24px 28px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      margin-bottom: 16px;
    }

    .page-header h1 {
      font-size: 28px;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== 筛选栏 ===== */
    .filter-bar {
      background: white;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-select {
      padding: 10px 16px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      background: white;
    }

    .filter-select:focus {
      outline: none;
      border-color: #007bff;
    }

    /* ===== 游戏记录列表 ===== */
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-card {
      background: white;
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .game-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .game-info {
      flex: 1;
    }

    .game-type-name {
      font-size: 18px;
      font-weight: bold;
      color: #2d3748;
      margin-bottom: 6px;
    }

    .game-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #6c757d;
    }

    .game-result {
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
    }

    .result-win {
      background: #d4edda;
      color: #155724;
    }

    .result-loss {
      background: #f8d7da;
      color: #721c24;
    }

    .result-draw {
      background: #fff3cd;
      color: #856404;
    }

    /* ===== 加载状态 ===== */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e9ecef;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* ===== 空状态 ===== */
    .empty-state {
      background: white;
      padding: 60px 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      text-align: center;
      color: #6c757d;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .game-card {
        flex-direction: column;
        text-align: center;
      }

      .game-meta {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>

<body>

  <!-- 导航栏 -->
  <div class="game-nav">
    <button class="nav-btn" onclick="window.location.href='/'">🏠 游戏大厅</button>
    <button class="nav-btn" onclick="window.location.href='/profile.html'">👤 个人资料</button>
    <button class="nav-btn active">📊 游戏记录</button>
    <button class="nav-btn" onclick="window.location.href='/shop.html'">🛒 星钻消费</button>
    <button class="nav-btn" onclick="window.location.href='/feedback.html'">💬 帮助/反馈</button>
  </div>

  <div class="container">

    <!-- 页面标题 -->
    <div class="page-header">
      <h1>📊 游戏记录 / 历史对局</h1>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
      <select class="filter-select" id="gameTypeFilter" onchange="loadGames()">
        <option value="all">全部游戏</option>
        <option value="gobang">五子棋</option>
        <option value="go">围棋</option>
        <option value="xiangqi">象棋</option>
        <option value="snake">贪吃蛇</option>
      </select>
      <select class="filter-select" id="resultFilter" onchange="loadGames()">
        <option value="all">全部结果</option>
        <option value="win">仅胜利</option>
        <option value="loss">仅失败</option>
        <option value="draw">仅平局</option>
      </select>
    </div>

    <!-- 加载状态 -->
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      <div>加载中...</div>
    </div>

    <!-- 游戏记录列表 -->
    <div class="games-list" id="gamesList" style="display: none;"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">🎮</div>
      <h3>暂无游戏记录</h3>
      <p>快去玩一局游戏吧！</p>
    </div>

  </div>

  <script>
    const socket = io();
    let userToken = null;
    let currentAccountId = null;

    // 游戏类型配置
    const gameTypeConfig = {
      gobang: { name: '五子棋', icon: '⚫', color: '#1a1a1a' },
      gomoku: { name: '五子棋', icon: '⚫', color: '#1a1a1a' },
      go: { name: '围棋', icon: '⚪', color: '#6c757d' },
      xiangqi: { name: '象棋', icon: '🏰', color: '#dc3545' },
      snake: { name: '贪吃蛇', icon: '🐍', color: '#28a745' }
    };

    // 初始化
    window.onload = () => {
      userToken = localStorage.getItem('userToken');
      if (!userToken) {
        alert('请先登录！');
        window.location.href = '/';
        return;
      }

      currentAccountId = localStorage.getItem('currentAccountId');

      // 直接加载数据（不需要等待Socket认证）
      loadGames();
    };

    // 加载游戏记录
    async function loadGames() {
      const loadingState = document.getElementById('loadingState');
      const gamesList = document.getElementById('gamesList');
      const emptyState = document.getElementById('emptyState');

      loadingState.style.display = 'block';
      gamesList.style.display = 'none';
      emptyState.style.display = 'none';

      try {
        const res = await fetch(`/api/games/history?accountId=${currentAccountId}&limit=50`);
        const data = await res.json();

        loadingState.style.display = 'none';

        if (!data.success || !data.data || data.data.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        // 筛选
        let games = data.data;
        const gameTypeFilter = document.getElementById('gameTypeFilter').value;
        const resultFilter = document.getElementById('resultFilter').value;

        if (gameTypeFilter !== 'all') {
          games = games.filter(g => g.gameType === gameTypeFilter);
        }

        if (resultFilter !== 'all') {
          games = games.filter(g => g.result === resultFilter);
        }

        if (games.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        // 渲染
        renderGames(games);
        gamesList.style.display = 'flex';

      } catch (err) {
        console.error('加载失败:', err);
        loadingState.innerHTML = '<div>加载失败，请刷新重试</div>';
      }
    }

    // 渲染游戏列表
    function renderGames(games) {
      const gamesList = document.getElementById('gamesList');
      gamesList.innerHTML = '';

      games.forEach(game => {
        const config = gameTypeConfig[game.gameType] || { name: '未知', icon: '❓', color: '#6c757d' };
        const card = document.createElement('div');
        card.className = 'game-card';

        let resultClass = 'result-draw';
        let resultText = '平局';
        if (game.result === 'win') {
          resultClass = 'result-win';
          resultText = '胜利 ✨';
        } else if (game.result === 'loss') {
          resultClass = 'result-loss';
          resultText = '失败';
        }

        card.innerHTML = `
          <div class="game-icon" style="background: ${config.color}20;">
            ${config.icon}
          </div>
          <div class="game-info">
            <div class="game-type-name">${config.name}</div>
            <div class="game-meta">
              <span>🎯 对手: ${game.opponent || 'AI'}</span>
              <span>📍 回合: ${game.moves}</span>
              <span>📅 ${formatDate(game.date || game.endTime)}</span>
            </div>
          </div>
          <div class="game-result ${resultClass}">${resultText}</div>
        `;

        gamesList.appendChild(card);
      });
    }

    // 格式化日期
    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;

      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';

      return date.toLocaleDateString('zh-CN');
    }
  </script>

</body>

</html>
