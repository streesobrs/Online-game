<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007bff">
  <title>游戏记录 - 多棋种联机大厅</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="replay-module.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.25s ease;
    }

    body {
      font-family: 'Microsoft Yahei', Arial, sans-serif;
      background: #f0f2f5;
      color: #2d3748;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== 顶部导航 ===== */
    .game-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      background: white;
      padding: 8px 16px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      width: 100%;
      max-width: 1100px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      background: #f8f9fa;
      color: #495057;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      background: #e9ecef;
      transform: translateY(-2px);
    }

    .nav-btn.active {
      background: #007bff;
      color: white;
    }

    .nav-btn.active:hover {
      background: #0056b3;
    }

    /* ===== 主容器 ===== */
    .container {
      width: 100%;
      max-width: 1100px;
    }

    /* ===== 页面标题 ===== */
    .page-header {
      background: white;
      padding: 24px 28px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      margin-bottom: 16px;
    }

    .page-header h1 {
      font-size: 28px;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== 筛选栏 ===== */
    .filter-bar {
      background: white;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-select {
      padding: 10px 16px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      background: white;
    }

    .filter-select:focus {
      outline: none;
      border-color: #007bff;
    }

    /* ===== 游戏记录列表 ===== */
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-card {
      background: white;
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .game-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .game-info {
      flex: 1;
    }

    .game-type-name {
      font-size: 18px;
      font-weight: bold;
      color: #2d3748;
      margin-bottom: 6px;
    }

    .game-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: #6c757d;
    }

    .game-result {
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
    }

    .result-win {
      background: #d4edda;
      color: #155724;
    }

    .result-loss {
      background: #f8d7da;
      color: #721c24;
    }

    .result-draw {
      background: #fff3cd;
      color: #856404;
    }

    /* ===== 加载状态 ===== */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e9ecef;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* ===== 空状态 ===== */
    .empty-state {
      background: white;
      padding: 60px 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      text-align: center;
      color: #6c757d;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .game-card {
        flex-direction: column;
        text-align: center;
      }

      .game-meta {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
  <!-- 回放弹窗样式 -->
  <style>
    .account-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .account-modal {
      background: white;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: modalSlideIn 0.3s ease;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .account-modal-title {
      font-size: 20px;
      font-weight: bold;
      color: #2d3748;
      margin-bottom: 20px;
      text-align: center;
    }

    /* 棋盘样式 */
    .replay-board {
      margin: 0 auto;
    }

    .gobang-cell,
    .go-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
      background: none;
    }

    .gobang-cell::before,
    .go-cell::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: none;
    }

    .last-move::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      border-radius: 50%;
      border: 2px solid #f1c40f;
      box-shadow: 0 0 6px rgba(241, 196, 15, 0.5);
      pointer-events: none;
    }

    .gobang-black {
      background: radial-gradient(circle at 35% 35%, #555, #111);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      z-index: 2;
      position: relative;
    }

    .gobang-white {
      background: radial-gradient(circle at 35% 35%, #fff, #ccc);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      z-index: 2;
      position: relative;
    }

    .go-black {
      background: radial-gradient(circle at 35% 35%, #555, #111);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      z-index: 2;
      position: relative;
    }

    .go-white {
      background: radial-gradient(circle at 35% 35%, #fff, #ccc);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      z-index: 2;
      position: relative;
    }

    /* 回放弹窗按钮样式 */
    #replay-modal button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      transition: none;
    }

    #replay-modal button:hover {
      opacity: 0.85;
      transform: none;
    }

    #replay-modal button:active {
      transform: scale(0.95);
    }

    /* 速度按钮 */
    #replay-modal [data-speed] {
      color: white;
    }

    /* 滑动条样式 */
    #replay-modal input[type="range"] {
      cursor: pointer;
      height: 6px;
    }

    #replay-modal input[type="range"]:focus {
      outline: none;
    }
  </style>
</head>

<body>

  <!-- 导航栏 -->
  <div class="game-nav">
    <button class="nav-btn" onclick="window.location.href='/'">🏠 游戏大厅</button>
    <button class="nav-btn" onclick="window.location.href='/profile.html'">👤 个人资料</button>
    <button class="nav-btn active">📊 游戏记录</button>
    <button class="nav-btn" onclick="window.location.href='/shop.html'">🛒 星钻消费</button>
    <button class="nav-btn" onclick="window.location.href='/feedback.html'">💬 帮助/反馈</button>
  </div>

  <div class="container">

    <!-- 页面标题 -->
    <div class="page-header">
      <h1>📊 游戏记录 / 历史对局</h1>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
      <select class="filter-select" id="gameTypeFilter" onchange="loadGames()">
        <option value="all">全部游戏</option>
        <option value="gobang">五子棋</option>
        <option value="go">围棋</option>
        <option value="xiangqi">象棋</option>
        <option value="snake">贪吃蛇</option>
        <option value="match3">消消乐</option>
      </select>
      <select class="filter-select" id="resultFilter" onchange="loadGames()">
        <option value="all">全部结果</option>
        <option value="win">仅胜利</option>
        <option value="loss">仅失败</option>
        <option value="draw">仅平局</option>
      </select>
    </div>

    <!-- 加载状态 -->
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      <div>加载中...</div>
    </div>

    <!-- 游戏记录列表 -->
    <div class="games-list" id="gamesList" style="display: none;"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon">🎮</div>
      <h3>暂无游戏记录</h3>
      <p>快去玩一局游戏吧！</p>
    </div>

  </div>

  <script>
    const socket = io();
    let userToken = null;
    let currentAccountId = null;
    let gamesById = {};

    // 统一附带登录 Token，服务端据此校验账号归属
    function authHeaders(extra) {
      const token = localStorage.getItem('userToken') || '';
      return Object.assign({ 'Authorization': token ? `Bearer ${token}` : '' }, extra || {});
    }

    // 游戏类型配置
    const gameTypeConfig = {
      gobang: { name: '五子棋', icon: '⚫', color: '#1a1a1a' },
      gomoku: { name: '五子棋', icon: '⚫', color: '#1a1a1a' },
      go: { name: '围棋', icon: '⚪', color: '#6c757d' },
      'chinese-chess': { name: '象棋', icon: '🏰', color: '#dc3545' },
      snake: { name: '贪吃蛇', icon: '🐍', color: '#28a745' },
      match3: { name: '消消乐', icon: '🍬', color: '#f59e0b' }
    };

    // 初始化
    window.onload = () => {
      userToken = localStorage.getItem('userToken');
      if (!userToken) {
        alert('请先登录！');
        window.location.href = '/';
        return;
      }

      currentAccountId = localStorage.getItem('currentAccountId');

      // 直接加载数据（不需要等待Socket认证）
      loadGames();
    };

    // 加载游戏记录
    async function loadGames() {
      const loadingState = document.getElementById('loadingState');
      const gamesList = document.getElementById('gamesList');
      const emptyState = document.getElementById('emptyState');

      loadingState.style.display = 'block';
      gamesList.style.display = 'none';
      emptyState.style.display = 'none';

      try {
        const res = await fetch(`/api/games/history?accountId=${currentAccountId}&limit=50`, { headers: authHeaders() });
        const data = await res.json();

        loadingState.style.display = 'none';

        if (!data.success || !data.data || data.data.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        // 筛选
        let games = data.data;
        gamesById = Object.fromEntries(data.data.map(g => [g.gameId, g]));
        const gameTypeFilter = document.getElementById('gameTypeFilter').value;
        const resultFilter = document.getElementById('resultFilter').value;

        if (gameTypeFilter !== 'all') {
          games = games.filter(g => g.gameType === gameTypeFilter);
        }

        if (resultFilter !== 'all') {
          games = games.filter(g => g.result === resultFilter);
        }

        if (games.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        // 渲染
        renderGames(games);
        gamesList.style.display = 'flex';

      } catch (err) {
        console.error('加载失败:', err);
        loadingState.innerHTML = '<div>加载失败，请刷新重试</div>';
      }
    }

    // 渲染游戏列表（各玩法只显示自己的字段）
    function renderGames(games) {
      const gamesList = document.getElementById('gamesList');
      gamesList.innerHTML = '';

      const modeNames = { level: '闯关', endless: '无尽', endless3: '三色爽局', rogue: '肉鸽试炼' };

      games.forEach(game => {
        const config = gameTypeConfig[game.gameType] || { name: '未知', icon: '❓', color: '#6c757d' };
        const isMatch3 = game.gameType === 'match3';
        const isSnake = game.gameType === 'snake';
        const card = document.createElement('div');
        card.className = 'game-card';

        let resultClass = 'result-draw';
        let resultText = '已结算';
        let typeName = config.name;
        const metaParts = [];

        if (isMatch3) {
          typeName = `消消乐 · ${modeNames[game.mode] || ''}`.trim();
          metaParts.push(`🎯 得分: ${game.score || 0}`);
          metaParts.push(`📍 步数: ${game.moves || 0}`);
          if (game.mode === 'level') {
            metaParts.push(`⭐ 星数: ${game.stars || 0}`);
            if (game.level) metaParts.push(`🎮 第 ${game.level} 关`);
          } else if (game.mode === 'rogue') {
            if (game.floor) metaParts.push(`🎮 第 ${game.floor} 层`);
            metaParts.push(`🃏 ${game.win ? '已通关' : '未通关'}`);
          }
        } else if (isSnake) {
          metaParts.push(`🎯 得分: ${game.score || 0}`);
          metaParts.push(`🐍 最长: ${game.maxLength || 0}`);
          metaParts.push(`🍎 食物: ${game.foodEaten || 0}`);
          metaParts.push(`📍 步数: ${game.moves || 0}`);
        } else {
          if (game.result === 'win') {
            resultClass = 'result-win';
            resultText = '胜利 ✨';
          } else if (game.result === 'loss') {
            resultClass = 'result-loss';
            resultText = '失败';
          } else if (game.result === 'draw') {
            resultText = '平局';
          }
          metaParts.push(`🎯 对手: ${game.opponent || 'AI'}`);
          metaParts.push(`📍 回合: ${game.moves || 0}`);
        }
        metaParts.push(`⏱ ${formatDurationMs(game.duration)}`);
        metaParts.push(`📅 ${formatDate(game.date || game.endTime)}`);

        // 消消乐没有逐帧回放；棋类与贪吃蛇有可回放的移动记录
        const canReplay = !isMatch3 && game.moves > 0 && game.gameId;

        card.innerHTML = `
          <div class="game-icon" style="background: ${config.color}20;">
            ${config.icon}
          </div>
          <div class="game-info">
            <div class="game-type-name">${typeName}</div>
            <div class="game-meta">
              ${metaParts.map(p => `<span>${p}</span>`).join('')}
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="game-result ${resultClass}">${resultText}</div>
            ${canReplay ? `<button onclick="openReplay('${game.gameId}', '${game.gameType}')" style="padding:6px 12px;border:none;border-radius:6px;background:#3498db;color:white;cursor:pointer;font-size:12px;font-weight:bold;">🎬 回放</button>` : ''}
            <button onclick="openGameDetail('${game.gameId}')" style="padding:6px 12px;border:none;border-radius:6px;background:#718096;color:white;cursor:pointer;font-size:12px;font-weight:bold;">详情</button>
          </div>
        `;

        gamesList.appendChild(card);
      });
    }

    // 毫秒时长 → 分:秒
    function formatDurationMs(ms) {
      const sec = Math.round((ms || 0) / 1000);
      return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    }

    // 打开对局详情（按玩法展示各自的字段）
    function openGameDetail(gameId) {
      const game = gamesById[gameId];
      if (!game) return;
      const meta = gameTypeConfig[game.gameType] || { name: '未知', icon: '❓' };
      const modeNames = { level: '闯关', endless: '无尽', endless3: '三色爽局', rogue: '肉鸽试炼' };
      const rows = [];
      const add = (label, value) => {
        if (value === undefined || value === null || value === '') return;
        rows.push([label, String(value)]);
      };

      add('游戏', meta.name);
      if (game.gameType === 'match3') {
        add('模式', modeNames[game.mode] || game.mode);
        add('得分', game.score);
        add('最高连锁', game.maxCombo);
        add('步数', game.moves);
        if (game.mode === 'level') {
          add('关卡', game.level ? `第 ${game.level} 关` : null);
          add('星数', game.stars || 0);
        } else if (game.mode === 'rogue') {
          add('到达层数', game.floor ? `第 ${game.floor} 层` : null);
          add('是否通关', game.win ? '是' : '否');
        }
      } else if (game.gameType === 'snake') {
        add('得分', game.score);
        add('最大长度', game.maxLength);
        add('吃到食物', game.foodEaten);
        add('步数', game.moves);
      } else {
        add('结果', { win: '胜利', loss: '失败', draw: '平局' }[game.result] || game.result);
        add('对手', game.opponent);
        add('回合数', game.moves);
        add('棋盘', game.boardSize ? `${game.boardSize} × ${game.boardSize}` : null);
        add('模式', game.gameMode === 'ai' ? '人机对战' : game.gameMode === 'pvp' ? '联机对战' : null);
      }
      add('时长', formatDurationMs(game.duration));
      add('时间', formatDate(game.date || game.endTime));

      const overlay = document.createElement('div');
      overlay.className = 'account-modal-overlay';
      const modalEl = document.createElement('div');
      modalEl.className = 'account-modal';
      modalEl.style.maxWidth = '420px';

      const title = document.createElement('div');
      title.className = 'account-modal-title';
      title.textContent = `${meta.icon} ${meta.name} 详情`;

      const grid = document.createElement('div');
      grid.style.cssText = 'display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;';
      rows.forEach(([label, value]) => {
        const labelEl = document.createElement('div');
        labelEl.style.color = '#718096';
        labelEl.textContent = label;
        const valueEl = document.createElement('div');
        valueEl.style.cssText = 'color:#2d3748;font-weight:600;';
        valueEl.textContent = value;
        grid.append(labelEl, valueEl);
      });

      const closeBtn = document.createElement('button');
      closeBtn.textContent = '关闭';
      closeBtn.style.cssText = 'margin-top:16px;width:100%;padding:10px;border:none;border-radius:8px;background:#3498db;color:white;font-weight:bold;cursor:pointer;';
      closeBtn.onclick = () => overlay.remove();
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      modalEl.append(title, grid, closeBtn);
      overlay.append(modalEl);
      document.body.appendChild(overlay);
    }

    // 格式化日期
    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;

      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';

      return date.toLocaleDateString('zh-CN');
    }

    // 打开游戏回放（在新标签页打开）
    async function openReplay(gameId, gameType) {
      try {
        const res = await fetch(`/api/games/replay/${gameId}`);
        const data = await res.json();
        if (data.success && data.data) {
          ReplayModule.showReplay(data.data);
        } else {
          alert('获取回放数据失败：' + (data.message || '未知错误'));
        }
      } catch (err) {
        alert('获取回放数据失败：' + err.message);
      }
    }
  </script>

</body>

</html>
